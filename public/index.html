<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radiophone</title>
  <meta name="description" content="Radiophone — 7.83 Hz Schumann Resonance Canlı Radyo">

  <!-- iOS PWA / Native Media Player -->
  <meta name="apple-mobile-web-app-title" content="Radiophone">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05070a">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="manifest" href="/manifest.json">

  <!-- NO external font requests — system fonts only for instant load -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-ambient"></div>

  <main class="minimal-app">
    <header class="minimal-header">
      <h1 class="brand-title">RADIOPHONE</h1>
      <p class="brand-sub">7.83 Hz SCHUMANN • CANLI RADYO</p>
    </header>

    <div class="power-container">
      <button class="power-button" id="powerBtn" aria-label="Radyoyu Aç / Kapat">
        <div class="power-ring"></div>
        <div class="power-inner">
          <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </div>
      </button>

      <div class="power-status" id="powerStatus">
        <span class="status-indicator" id="statusDot"></span>
        <span class="status-label" id="statusLabel">DOKUN VE BAŞLAT</span>
      </div>
    </div>

    <footer class="minimal-footer">
      <a href="/hls/live.m3u8" class="apple-direct-link" id="directLink">Apple Oynatıcıda Aç</a>
      <span class="sep">•</span>
      <span id="footerInfo">Canlı HLS • 7.83 Hz</span>
    </footer>
  </main>

  <!--
    Native audio element — HLS source for AVPlayer/Safari.
    'title' appears in iOS lock screen / control center.
    'playsinline' prevents fullscreen takeover on iOS.
  -->
  <audio id="radioAudio"
         title="Radiophone"
         preload="none"
         playsinline
         x-webkit-airplay="allow">
    <source src="/hls/live.m3u8" type="application/vnd.apple.mpegurl">
  </audio>

  <script src="app.js"></script>
</body>
</html>
